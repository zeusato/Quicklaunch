# Push a tag like v3.0.1 → builds the portable exe and publishes a GitHub Release.
# The app's updater reads releases/latest and downloads QuickStartLauncher-win-x64.zip (+ .sha256).
name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        shell: pwsh
        run: ./scripts/Publish.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v'))
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/dist/QuickStartLauncher-win-x64.zip artifacts/dist/QuickStartLauncher-win-x64.zip.sha256 --title "QuickStart ${{ github.ref_name }}" --generate-notes
